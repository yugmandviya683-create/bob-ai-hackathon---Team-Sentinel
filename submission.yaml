submission:
  title: "Clinical Trial Risk Monitor & Protocol Deviation Detector"                          # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
  In large clinical trials (5,000+ patient visits across 200+ sites), protocol
    deviations — missed visits, wrong dosing, banned co-medications — go undetected
    until the FDA audit, where a single rejected submission costs $50–100M and delays
    approval 6–12 months. Clinical trial risk managers and sponsors experience this
    problem today because they rely on slow, sampled, retrospective site monitoring
    instead of real-time visibility.


  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built an end-to-end pipeline that checks every patient visit against a
    structured protocol spec, classifies each deviation's severity per ICH E6 GCP
    (Major/Minor/Administrative) with the exact clause cited, and rolls deviations
    into an explainable, weighted per-site risk score on a live dashboard — so a
    risk manager can see which sites are highest risk, drill into the deviations
    behind that score, and generate a CAPA-ready report in one click.
  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "GCP severity classification — each deviation graded Major/Minor/Administrative per ICH E6(R2), with the exact clause cited for auditability"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "GCP severity classification — each deviation graded Major/Minor/Administrative per ICH E6(R2), with the exact clause cited for auditability"
    - "Explainable site risk scoring — weighted formula (5×Major + 2×Minor + 1×Admin) ÷ visits ranks all 200+ sites, fully decomposable back into source deviations"
    - "One-click CAPA report generation — deviation summary, root-cause hypothesis, and recommended actions drafted in seconds per flagged site"                               # optional 4th
    - "Interactive risk-ledger dashboard — sortable, filterable, searchable site table with a drill-down drawer per site"                               # optional 5th

  tech_stack:
    languages: []                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: []                     # e.g., ["FastAPI", "React"]
    ibm_technologies: []               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: []                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We validated the detector against ground-truth injected deviations rather than
    just assuming it works: 100% precision (zero false positives) and 100% recall on
    every safety-relevant deviation type (wrong dose, banned co-medication, missed
    safety assessment, visit-window violation). We're equally proud of the
    explainability discipline throughout — every deviation flag traces to a specific
    ICH E6(R2) GCP clause, and every site risk score decomposes back into the exact
    deviations behind it, so nothing is a black box an auditor would have to take on
    faith.
  known_limitations: >                 # Optional but recommended — be honest about gaps
   Patient records are synthetic (seeded, not from a real trial), since real trial
    data can't be used publicly for privacy reasons. Detection recall drops to 69.5%
    overall because administrative-only deviations (missing signatures, late forms)
    aren't yet representable in the data schema — though recall is 100% on all
    safety-relevant deviations. The CAPA report in the dashboard is rule-based
    template text keyed to deviation type, not a live LLM call; capa_agent.py's LLM
    integration is scaffolded but not yet wired in. There's no backend, database,
    auth, or persistence — it's a static client-side dashboard with data embedded at
    build time — and it's only been spot-checked in a headless browser, not across
    real browsers/devices.

